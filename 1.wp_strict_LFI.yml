rules:
  - id: wp-unsafe-include
    languages:
      - php
    message: "Unsafe include/require with user input. Leads to Local File Inclusion (LFI)."
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: include($ARG)
          - pattern: include_once($ARG)
          - pattern: require($ARG)
          - pattern: require_once($ARG)
      - metavariable-regex:
          metavariable: $ARG
          regex: '^\$_(GET|POST|REQUEST|COOKIE|SERVER)'